<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luna OS Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-white min-h-screen flex flex-col font-sans antialiased">

  <nav class="glass-panel sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-white/10 shadow-lg">
    <div class="flex items-center gap-3">
      <i data-lucide="bot" class="w-8 h-8 text-cyan-400"></i>
      <h1 class="text-xl font-bold tracking-wider">LUNA<span class="text-cyan-400">OS</span></h1>
    </div>
    
    <div class="flex gap-2 overflow-x-auto no-scrollbar">
      <button class="nav-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-all" data-target="drive">Drive &amp; Vision</button>
      <button class="nav-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all" data-target="media">Stories &amp; Music</button>
      <button class="nav-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all" data-target="education">Education</button>
    </div>
  </nav>

  <main class="flex-1 container mx-auto p-4 max-w-5xl relative z-10 pb-28">

    <!-- ======== Drive & Vision ======== -->
    <section id="drive" class="tab-section active flex flex-col lg:flex-row gap-6">
      
      <div class="glass-panel flex-1 rounded-3xl p-5 border border-white/10 shadow-2xl flex flex-col gap-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold flex items-center gap-2">
            <i data-lucide="video" class="w-5 h-5 text-cyan-400"></i> Vision Matrix
          </h2>
          <div class="flex gap-2">
            <button onclick="startFeed()" class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/50 px-3 py-1 rounded-lg text-sm hover:bg-cyan-500/40 transition">Start</button>
            <button onclick="stopFeed()" class="bg-red-500/20 text-red-300 border border-red-500/50 px-3 py-1 rounded-lg text-sm hover:bg-red-500/40 transition">Stop</button>
          </div>
        </div>
        <div class="w-full aspect-video bg-black/60 rounded-2xl overflow-hidden border border-white/5 relative shadow-inner">
          <img id="stream" src="" class="w-full h-full object-cover" alt="Camera Feed Offline">
        </div>
      </div>

      <div class="glass-panel lg:w-80 rounded-3xl p-6 border border-white/10 shadow-2xl flex flex-col items-center justify-center gap-6">
        <h2 class="text-lg font-bold self-start flex items-center gap-2">
            <i data-lucide="gamepad-2" class="w-5 h-5 text-purple-400"></i> Kinetic Drive
        </h2>
        
        <div class="grid grid-cols-3 gap-3">
          <div></div>
          <button class="control-btn text-cyan-300" onmousedown="sendMove('forward')" onmouseup="sendMove('stop')" ontouchstart="sendMove('forward')" ontouchend="sendMove('stop')">
            <i data-lucide="chevron-up" class="w-8 h-8"></i>
          </button>
          <div></div>
          
          <button class="control-btn text-cyan-300" onmousedown="sendMove('left')" onmouseup="sendMove('stop')" ontouchstart="sendMove('left')" ontouchend="sendMove('stop')">
            <i data-lucide="chevron-left" class="w-8 h-8"></i>
          </button>
          <button class="control-btn bg-red-500/20 border-red-500/30 text-red-400 hover:bg-red-500/40" onclick="sendMove('stop')">
            <i data-lucide="square" class="w-6 h-6 fill-current"></i>
          </button>
          <button class="control-btn text-cyan-300" onmousedown="sendMove('right')" onmouseup="sendMove('stop')" ontouchstart="sendMove('right')" ontouchend="sendMove('stop')">
            <i data-lucide="chevron-right" class="w-8 h-8"></i>
          </button>
          
          <div></div>
          <button class="control-btn text-cyan-300" onmousedown="sendMove('backward')" onmouseup="sendMove('stop')" ontouchstart="sendMove('backward')" ontouchend="sendMove('stop')">
            <i data-lucide="chevron-down" class="w-8 h-8"></i>
          </button>
          <div></div>
        </div>
      </div>
    </section>

    <!-- ======== Stories & Music ======== -->
    <section id="media" class="tab-section hidden grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <div class="glass-panel rounded-3xl p-6 border border-white/10 shadow-2xl flex flex-col gap-4">
        <h2 class="text-lg font-bold flex items-center gap-2">
          <i data-lucide="book-open" class="w-5 h-5 text-amber-400"></i> Story Library
        </h2>
        <div class="grid grid-cols-2 gap-3 overflow-y-auto max-h-96 pr-2 custom-scrollbar">
          <button class="action-btn" onclick="playStory('story1')">Story 1</button>
          <button class="action-btn" onclick="playStory('story2')">Story 2</button>
          <button class="action-btn" onclick="playStory('story3')">Story 3</button>
          <button class="action-btn" onclick="playStory('story4')">Story 4</button>
          <button class="action-btn" onclick="playStory('story5')">Story 5</button>
          <button class="action-btn" onclick="playStory('story6')">Story 6</button>
          <button class="action-btn" onclick="playStory('story7')">Story 7</button>
          <button class="action-btn" onclick="playStory('story8')">Story 8</button>
          <button class="action-btn" onclick="playStory('story9')">Story 9</button>
          <button class="action-btn" onclick="playStory('story10')">Story 10</button>
        </div>
      </div>

      <div class="glass-panel rounded-3xl p-6 border border-white/10 shadow-2xl flex flex-col gap-4">
        <h2 class="text-lg font-bold flex items-center gap-2">
          <i data-lucide="music" class="w-5 h-5 text-indigo-400"></i> Music
        </h2>
        <div class="grid grid-cols-2 gap-3 overflow-y-auto max-h-96 pr-2 custom-scrollbar">
          <button class="action-btn" onclick="playMusic('music1')">Music 1</button>
          <button class="action-btn" onclick="playMusic('music2')">Music 2</button>
          <button class="action-btn" onclick="playMusic('music3')">Music 3</button>
          <button class="action-btn" onclick="playMusic('music4')">Music 4</button>
          <button class="action-btn" onclick="playMusic('music5')">Music 5</button>
          <button class="action-btn" onclick="playMusic('music6')">Music 6</button>
          <button class="action-btn" onclick="playMusic('music7')">Music 7</button>
          <button class="action-btn" onclick="playMusic('music8')">Music 8</button>
          <button class="action-btn" onclick="playMusic('music9')">Music 9</button>
          <button class="action-btn" onclick="playMusic('music10')">Music 10</button>
        </div>
      </div>
    </section>

    <!-- ======== Education ======== -->
    <section id="education" class="tab-section hidden glass-panel rounded-3xl p-6 border border-white/10 shadow-2xl flex flex-col gap-6 max-w-2xl mx-auto">
      <h2 class="text-lg font-bold flex items-center gap-2">
          <i data-lucide="graduation-cap" class="w-5 h-5 text-green-400"></i> Learning Modules
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <button class="action-btn py-8 text-lg flex flex-col gap-3" onclick="playEducation('alphabet')">
          <i data-lucide="case-sensitive" class="w-10 h-10 text-cyan-300"></i> Alphabet
        </button>
        <button class="action-btn py-8 text-lg flex flex-col gap-3" onclick="playEducation('numbers')">
          <i data-lucide="binary" class="w-10 h-10 text-purple-300"></i> Numbers
        </button>
        <button class="action-btn py-8 text-lg flex flex-col gap-3" onclick="playEducation('animals')">
          <i data-lucide="paw-print" class="w-10 h-10 text-amber-300"></i> Animals
        </button>
      </div>
    </section>

  </main>

  <!-- ======== Floating Playback Card ======== -->
  <div id="playback-bar" class="playback-bar hidden relative">
    <!-- Close button to dismiss/hide the card -->
    <button class="absolute top-3 right-3 text-white/40 hover:text-white transition" onclick="hidePlaybackBar()">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>

    <!-- Row 1: icon + NOW PLAYING / track name -->
    <div class="playback-info">
      <div class="playback-icon" id="playback-icon">
        <i data-lucide="book-open" class="w-5 h-5 text-cyan-400"></i>
      </div>
      <div class="playback-text">
        <span class="playback-label">Now Playing</span>
        <span class="playback-title" id="playback-title">Nothing playing</span>
      </div>
    </div>

    <!-- Row 2: Playback Controls (Prev, Play/Pause toggle, Next) -->
    <div class="playback-controls">
      <button class="pb-btn" onclick="prevCurrent()" title="Previous">
        <i data-lucide="skip-back" class="w-5 h-5"></i>
      </button>
      
      <!-- Play/Pause toggle button -->
      <button id="play-pause-btn" class="pb-btn pb-btn-playpause" onclick="togglePlayPause()" title="Pause">
        <i id="play-pause-icon" data-lucide="pause" class="w-5 h-5 fill-current"></i>
      </button>
      
      <button class="pb-btn" onclick="nextCurrent()" title="Next">
        <i data-lucide="skip-forward" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Row 3: Volume Indicator & Control -->
    <div class="volume-container">
      <button class="vol-btn" onclick="volumeDown()" title="Volume Down">
        <i data-lucide="volume-1" class="w-4 h-4"></i>
      </button>
      
      <div class="volume-progress-bar">
        <div id="volume-indicator-bar" class="volume-progress-fill" style="width: 50%;"></div>
      </div>
      <span id="volume-text" class="volume-text">50%</span>
      
      <button class="vol-btn" onclick="volumeUp()" title="Volume Up">
        <i data-lucide="volume-2" class="w-4 h-4"></i>
      </button>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
